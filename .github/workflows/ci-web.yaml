# CI for the website. Build the image, deploy dev on push / prod on release, via the lab repo's
# reusable workflows. Runs only when site source changes — the manifests under deploy/web are
# reconciled by Flux directly, and the other apps live under deploy/.
name: ci-web
on:
  pull_request:
    paths-ignore: [deploy/**, docs/**]
  push:
    branches: [main]
    paths-ignore: [deploy/**, docs/**]
  release: { types: [published] }
jobs:
  build:
    permissions: { contents: read, packages: write }
    uses: zing-rsa/lab/.github/workflows/build.yml@main
  deploy-dev:
    if: github.event_name == 'push'
    needs: build
    permissions: { contents: write }
    uses: zing-rsa/lab/.github/workflows/deploy.yml@main
    with:
      env: dev
      tag: ${{ github.sha }}
      overlay_path: deploy/web/overlays/dev
  deploy-prod:
    if: github.event_name == 'release'
    needs: build
    permissions: { contents: write }
    uses: zing-rsa/lab/.github/workflows/deploy.yml@main
    with:
      env: prod
      tag: ${{ github.event.release.tag_name }}
      overlay_path: deploy/web/overlays/prod
