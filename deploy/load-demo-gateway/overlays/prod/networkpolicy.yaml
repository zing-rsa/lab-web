# App-scoped default-deny for load-demo-gateway. Reachable from the Gateway (browser WebSocket)
# and from Prometheus (metrics scrape); out it needs DNS, NATS (publish + consumer info), and
# Prometheus (processed-TPS / replica queries). No public egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: load-demo-gateway }
spec:
  podSelector:
    matchLabels: { app: load-demo-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    # The shared Gateway data plane (browser WebSocket to /loadgen).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { protocol: TCP, port: 8080 }
    # Prometheus (observability ns) scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    # DNS (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # NATS client port (publish transactions, read consumer backlog, worker heartbeats).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: nats-prod }
      ports:
        - { protocol: TCP, port: 4222 }
    # Prometheus HTTP API (processed TPS + worker replica queries).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 9090 }
