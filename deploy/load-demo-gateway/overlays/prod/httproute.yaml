# Same-origin routing on prod: infra.zingdev.xyz/loadgen -> load-demo-gateway, while lab-web's own
# HTTPRoute keeps the rest of that host. Both attach to the infra-apex-https listener (the bare
# apex) from the infra namespace; Envoy merges them and the more specific /loadgen prefix wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: load-demo-gateway }
spec:
  parentRefs: [{ name: main, namespace: envoy-gateway-system, sectionName: infra-apex-https }]
  hostnames: [infra.zingdev.xyz]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /loadgen }
      backendRefs: [{ name: load-demo-gateway, port: 80 }]
