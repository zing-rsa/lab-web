# load-demo-gateway: the single public WebSocket entry point for the load demo. Kept at exactly
# one replica — it counts offered load in-process, so it must not be horizontally scaled.
# Namespace, image tag and the env-specific vars (ALLOWED_ORIGINS, WORKER_NAMESPACE, NATS_URL —
# the last points at the per-env broker nats-{dev,prod}) are set by the overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-demo-gateway
  labels:
    app: load-demo-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-demo-gateway
  template:
    metadata:
      labels:
        app: load-demo-gateway
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: load-demo-gateway
          image: ghcr.io/zing-rsa/load-demo-gateway
          env:
            - { name: NATS_URL, value: "nats://nats.nats.svc.cluster.local:4222" }
            - { name: PROM_URL, value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090" }
            - { name: WORKER_DEPLOYMENT, value: "load-demo-worker" }
            - { name: MAX_TPS_GLOBAL, value: "500" }
            - { name: MAX_TPS_CONN, value: "200" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
