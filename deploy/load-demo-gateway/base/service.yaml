# ClusterIP for load-demo-gateway. Port 80 backs the HTTPRoute (/loadgen WebSocket); Prometheus
# scrapes /metrics on the same port directly via this Service (never through the ingress).
apiVersion: v1
kind: Service
metadata:
  name: load-demo-gateway
  labels:
    app: load-demo-gateway
spec:
  selector:
    app: load-demo-gateway
  ports:
    - { name: http, port: 80, targetPort: http }
