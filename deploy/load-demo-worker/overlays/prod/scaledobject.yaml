# KEDA scales load-demo-worker on NATS JetStream backlog. When offered load outpaces the current
# pods the consumer's pending count climbs past lagThreshold and KEDA adds replicas (up to max);
# when a burst ends and the backlog drains, the fast scaleDown behaviour returns to the floor.
#
# maxReplicaCount is deliberately small and the pod requests tiny (see base/deployment.yaml) so
# the whole scaled set always fits the warm worker node — pods scale, nodes do not.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: load-demo-worker
spec:
  scaleTargetRef:
    name: load-demo-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Rate-limit both directions to one pod at a time so the pool tracks load gradually
        # instead of slamming to max and back. Scale-up is immediate (no stabilization); scale-down
        # waits a minute of sustained low backlog so a briefly-drained queue doesn't cause flapping.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 1, periodSeconds: 5 }
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - { type: Pods, value: 1, periodSeconds: 10 }
  triggers:
    - type: nats-jetstream
      metadata:
        # Monitoring (8222) is only exposed on the headless service; the ClusterIP `nats` service
        # publishes the client port (4222) only. Points at the prod-only broker so KEDA scales on
        # the prod backlog exclusively.
        natsServerMonitoringEndpoint: "nats-headless.nats-prod.svc.cluster.local:8222"
        account: "$G"
        stream: "TRANSACTIONS"
        consumer: "txworker"
        lagThreshold: "30"
