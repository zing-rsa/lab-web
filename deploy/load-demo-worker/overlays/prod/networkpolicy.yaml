# App-scoped default-deny for load-demo-worker. It only needs DNS + NATS out, and to be scraped
# by Prometheus in. No public HTTPS egress — it talks to nothing external.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: load-demo-worker }
spec:
  podSelector:
    matchLabels: { app: load-demo-worker }
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus (observability ns) scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    # DNS (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # NATS client port (JetStream consume + heartbeat publish).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: nats-prod }
      ports:
        - { protocol: TCP, port: 4222 }
