apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-dev
resources:
- ../../base
- httproute.yaml
- networkpolicy.yaml
images:
- name: ghcr.io/zing-rsa/lab-web
  newTag: 452ac8d8c23523c5583bfb08a813f3be0edf1e92
patches:
- patch: |-
    - op: add
      path: /spec/template/metadata/annotations/resource.opentelemetry.io~1deployment.environment.name
      value: dev
  target:
    kind: Deployment
    name: lab-web
