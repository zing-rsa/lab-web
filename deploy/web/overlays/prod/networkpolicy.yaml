# Default-deny for the lab-web pods. Selecting the pod for a direction denies all
# traffic in that direction except the rules below. This is a static site, so it
# only needs to be reachable from the Gateway and to resolve DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: lab-web }
spec:
  podSelector:
    matchLabels: { app: lab-web }
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the shared Gateway data plane may reach the app.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    # DNS (CoreDNS in kube-system).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # OTLP traces to the Alloy collector in the observability namespace.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
          podSelector:
            matchLabels: { app.kubernetes.io/name: alloy }
      ports:
        - { protocol: TCP, port: 4318 }
